name: swarm-massive-outreach-skill
description: |
  Autonomous compliant outreach skill that checks environment configuration, discovers public targets, deduplicates against mailbox and Notion, sends personalized SMTP emails, and logs every action to Notion.
version: 1.0.0
license: MIT
author: samihalawa
homepage: https://github.com/samihalawa/swarm-massive-outreach-skill

interface:
  display_name: "Verified Outreach And Replies"
  short_description: "Run authorized outreach with current reply history and native proof"
  default_prompt: "Use $swarm-massive-outreach-skill for the authorized campaign. Reconcile complete current inbound, Sent, Drafts and provider history before follow-up; route broader qualified-opportunity ranking and cash-profit analysis to $inbox-forensic-action-operator-skill. Preserve scope and existing sends; do not create recurring automations."
